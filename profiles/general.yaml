# The docs directory is named after the project, so this keeps today's docs/autornd/.
name: "AutoRnD"

framing:
  team: "a team"
  request_kind: "request"
  request_analyst: "a request analyst"
  work: "work"
  implementation: "implementation"
  deliverables: "the document, the plan, the procedure, the analysis, the calculation"
  practitioner: "a practitioner"
  practitioners: "practitioners"
  competent_practitioner: "a practitioner in the field"
  senior_practitioner: "a careful senior practitioner in the field"
  independent_reviewer: "an independent senior reviewer"
  task: "task"
  documentation: "documentation"
  questions: "questions"
  sources: "the governing rules and standards, official specifications, and original publications"
  unrecallable_examples: "a mass migration, a public release, a shipped product"
  role_example: "lead"
  unit_examples: ""
  gap_examples: ""
  # The triage risk guide's worked examples, the sentence that defines a hazard,
  # the three words the decision switches' questions take, and the phrases that
  # mean a request asks for its sources. They were written into the code in one
  # field's words, physical engineering, and every profile taught with them;
  # engineering.yaml keeps those exact words. This is the universal profile, so
  # its examples come from several fields at once (a building, a patient, a
  # payment, a filing, a live system) and from none in particular. Only the
  # examples move. The rules around them stay in the code and are the same for
  # every profile, because the risk axis must not move with the profile
  # (docs/handover-review.md, B2: of the 23 wide-suite sectors that read the
  # same on every repeat in both arms, none changed risk under another profile).
  # A hazard text keeps both injury to a person and damage to what the work
  # touches. source_request_terms is one phrase per line; none means only the
  # generic phrases (cite, quote the, with sources, according to the) count.
  risk_harm_rules: |-
    building and fire codes, electrical codes,
    food and medicine safety, clinical practice, workplace safety, environmental
    limits
  risk_paper_examples: |-
    A load-bearing calculation, a dosing schedule and a safety
    notice are critical while still in draft, because the draft is what gets
    built, given out and audited.
  risk_high_examples: |-
    the answer changes the real world or a live system — acting on a
      patient, sending a payment, filing a document, installing or modifying
      equipment, deploying a change — or is safety-critical in function even while
      still a draft, such as a dosing rule or a safety check; or it ships as core
      system behaviour, a security boundary, or data integrity. A payment sent
      from a live account stays sent, and someone relies on it
  risk_medium_examples: |-
    the answer is still a decision, reversible until an order is placed
      or a document is signed — choosing between options, working out a quantity,
      calculating a budget, setting a limit, taking a measurement
  risk_protective_example: |-
    Planning the backup for a customer database is
    planning work, and a wrong answer loses every record, so it is at least high
    rather than medium. It is critical only if a person can be harmed: losing
    data, goods or money, however much of it, is high.
  hazard_harm: "injure a person or damage property or equipment"
  switch_outside_sources: "a statute, a regulation, a standard, a guideline or a published figure"
  switch_computed_values: "a sum, a rate, a dose, a balance or a total"
  switch_published_documents: "a rule, a statute, a standard or another published document"
  source_request_terms: ""
  # The escalation prompt's words (who writes the autopsy, who it directs, what it looks for and the
  # plan it reads). Only names and labels: the rules of the prompt, including when it may ask for a
  # person, stay in the code and are the same for every profile.
  escalation_persona: "the Principal Reviewer for AutoRnD"
  escalation_worker: "Lead"
  escalation_flaw: "logic or planning flaw"
  escalation_correction: "logic or missing inputs"
  escalation_scope: "the current plan"
  escalation_plan_heading: "Plan:"


roles:
  lead:
    name: "Lead"
    tier: engineering
    expertise: "Does the work the request asks for, in full."
  reviewer:
    name: "Reviewer"
    tier: engineering
    expertise: "Checks the work against what the request asked, and names what is wrong or missing."
  planner:
    name: "Planner"
    tier: architecture
    expertise: "Holds the whole view: what the request needs, in what order, and what it depends on."

structural_roles:
  checks_work: reviewer
  holds_system_view: planner
