roles:
  lead:
    name: "Lead"
    tier: engineering
    expertise: "Does the work the request asks for, in full."
  reviewer:
    name: "Reviewer"
    tier: engineering
    expertise: "Checks the work against what the request asked, and names what is wrong or missing."
  planner:
    name: "Planner"
    tier: architecture
    expertise: "Holds the whole view: what the request needs, in what order, and what it depends on."

structural_roles:
  checks_work: reviewer
  holds_system_view: planner
