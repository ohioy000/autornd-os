framing:
  team: "a team"
  request_kind: "request"
  request_analyst: "a request analyst"
  work: "work"
  implementation: "implementation"
  deliverables: "the document, the plan, the procedure, the analysis, the calculation"
  practitioner: "a practitioner"
  practitioners: "practitioners"
  competent_practitioner: "a practitioner in the field"
  senior_practitioner: "a careful senior practitioner in the field"
