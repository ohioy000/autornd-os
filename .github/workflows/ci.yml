name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # pyproject.toml is the only dependency manifest. This step installed
      # from requirements.txt until the two manifests were merged, which is
      # precisely why this matrix stayed green on three Python versions while
      # `pip install -e .` was completely broken.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # This job exists because the matrix above cannot catch a packaging fault: it
  # runs against the source tree, so it passes no matter what the metadata says.
  # Both faults it guards against were live in this repo — a runtime dependency
  # present in one manifest and absent from the other, and flat-layout package
  # discovery that failed the build outright.
  #
  # One Python version on purpose: this job tests packaging metadata, not
  # version compatibility, which the matrix already covers.
  editable-install:
    runs-on: ubuntu-latest

    # config.py validates the six required model tiers at import time and exits
    # if any is unset, so an import smoke needs placeholders. Nothing is called
    # and no real key is used. The matrix job deliberately does NOT get these —
    # tests/conftest.py injects its own, and masking that here would hide it
    # breaking.
    env:
      MODEL_TRIAGE: test-provider/test-triage
      MODEL_ENGINEERING: test-provider/test-engineering
      MODEL_ARCHITECTURE: test-provider/test-architecture
      MODEL_ESCALATION: test-provider/test-escalation
      MODEL_RESEARCH: test-provider/test-research
      MODEL_SEARCH: test-provider/test-search

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No dev extra: this is the install a user gets.
      - name: Editable install from project metadata
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Import what a real process touches at startup. The missing dependency
      # was reached through a transitive import (api/auth.py -> jwt), so
      # importing the package alone would not have found it.
      - name: Import smoke test
        run: |
          python -c "
          import autornd.main, autornd.api.auth, autornd.api.routes
          import autornd.graph.executor, autornd.routing.openrouter
          import autornd.evals.runner
          print('editable install imports clean')
          "

      # A built wheel is a second shape with its own failure mode: the
      # dashboard template is package data and was absent from every wheel
      # until pyproject declared it.
      - name: Built wheel carries its package data
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -c "
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/autornd-*.whl')[0]).namelist()
          assert 'autornd/api/templates/dashboard.html' in names, names
          print('wheel carries the dashboard template')
          "

  # The last install shape nothing exercised. The editable-install job above
  # covers project metadata and a built wheel; this covers the image, which is
  # the only shape where the package, its data files and the server all have to
  # resolve together at runtime. Blueprint 001's lesson in its deployment form:
  # the fault a test suite structurally cannot see is the one that ships, and
  # `dashboard.html` missing from a build was exactly that fault.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -t autornd:ci .

      # Same placeholders as the import smoke: config.py validates the six
      # tiers at import and exits without them. No key — an empty one is the
      # honest default, and the catalogue endpoint needs no auth anyway.
      - name: Run the container
        run: |
          docker run -d --name autornd-ci -p 8100:8100 \
            -e MODEL_TRIAGE=test-provider/test-triage \
            -e MODEL_ENGINEERING=test-provider/test-engineering \
            -e MODEL_ARCHITECTURE=test-provider/test-architecture \
            -e MODEL_ESCALATION=test-provider/test-escalation \
            -e MODEL_RESEARCH=test-provider/test-research \
            -e MODEL_SEARCH=test-provider/test-search \
            autornd:ci

      # A retry loop rather than a sleep: startup is a couple of seconds
      # locally, but the number to trust is the one this loop measures, not one
      # written into a sleep.
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 10); do
            if curl -sf -o /dev/null http://127.0.0.1:8100/api/health; then
              echo "answered after $i attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "never answered"; docker logs autornd-ci; exit 1

      # Asserted against what the code actually does, checked by running it:
      # with placeholder ids every tier comes back unverified, so `degraded`
      # naming all six is the correct answer and `ok` would mean the check had
      # silently not run. A smoke that accepts either proves nothing.
      - name: Health reports honestly
        run: |
          body=$(curl -sf http://127.0.0.1:8100/api/health) || {
            docker logs autornd-ci; exit 1; }
          echo "$body"
          echo "$body" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['service'] == 'autornd', d
          assert d['status'] == 'degraded', (
              'placeholder models cannot verify; ok means the check never ran', d)
          missing = {'triage', 'engineering', 'architecture', 'escalation',
                     'research', 'search'} - set(d['unverified_models'])
          assert not missing, ('tiers missing from the report', missing)
          print('health is degraded and names all six tiers, as it should be')
          "

      # The wheel-data fault in its deployment shape: dashboard.html is read
      # off disk at request time, and no built wheel carried it until 001.
      - name: The dashboard resolves inside the container
        run: |
          code=$(curl -s -o /tmp/dash.html -w '%{http_code}' http://127.0.0.1:8100/)
          [ "$code" = "200" ] || { echo "GET / -> $code"; docker logs autornd-ci; exit 1; }
          grep -qi '<html' /tmp/dash.html || {
            echo "200 but not a page"; head -c 400 /tmp/dash.html; exit 1; }
          echo "dashboard served, $(wc -c < /tmp/dash.html) bytes"

      - name: Container logs
        if: always()
        run: docker logs autornd-ci || true

      - name: Stop
        if: always()
        run: docker rm -f autornd-ci || true
