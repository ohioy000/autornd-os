name: engineering-rnd
description: >
  The default AutoRnD pipeline, written as a graph. This reproduces the
  sequence that used to be hardcoded in the engine — triage, plan, feasibility,
  implement/validate, review — so it is the baseline any variant is measured
  against. Copy it and change it: that is the point of it being a file.

nodes:
  # ── classify ────────────────────────────────────────────────────────────
  - id: triage
    kind: ai
    tier: triage
    prompt: triage
    schema: TriageVerdict

  # Grounding is assembled deterministically. It costs nothing and it is the
  # single biggest lever on output quality.
  - id: context
    kind: check
    check: build_context
    depends_on: [triage]

  # ── plan ────────────────────────────────────────────────────────────────
  # Planning normally wants the heavyweight tier: the plan constrains every
  # token spent after it. Low-risk work is the exception — a reasoning model
  # spent two and a half minutes planning a card restyle in a measured run,
  # which is latency and spend the change did not warrant.
  - id: plan
    kind: ai
    tier: architecture
    tier_when:
      "triage.risk == 'low'": engineering
    specialist: systems_architect
    prompt: plan
    schema: PlanVerdict
    max_tokens: plan_max_tokens
    depends_on: [context]

  # Specialists pressure-test the plan before any implementation tokens are
  # spent. No point reviewing a plan the architect has already declared blocked.
  - id: feasibility
    kind: ai
    tier: engineering
    specialist: assigned        # every assigned specialist, in parallel
    prompt: feasibility
    depends_on: [regrounding_loop]
    when: plan.ready == true

  # Ruling D37 (owner-supplied, recorded by the advisor, 2026-09-30,
  # superseding the D34 text this file carried at 2a45d61): a plan that is
  # not ready and names blocking unknowns gets ONE re-grounding round. The
  # shape is a loop declared exactly like build_loop, because a linear chain
  # runs each node id once — plan would run once and no second node id would
  # do either, since downstream reads plan.*. The loop body re-runs plan on
  # the re-grounded context; the pure check exits it (passed == false) when
  # the plan is ready, risk is low, no blocker is novel, or a round ran.
  # No gate in the body, so nothing routes out of the loop. Downstream
  # depends on the loop, not on plan (a loop owns its body): feasibility
  # re-runs on the final plan, and plan_ready still blocks outside it. No
  # bound setting, no new tier.
  - id: reground_context
    kind: check
    check: reground_context
    args:
      # A missing field resolves loudly (conditions fail on absent paths),
      # so a fixture verdict without blockers would take the whole suite
      # down with one ConditionError. The real verdict defaults blockers
      # to [] (verdicts.py); fixtures must too — see the convention-22 note
      # on the IMPL double in tests/test_graph.py.
      ready: plan.ready
      risk: triage.risk
      blockers: plan.blockers
      asked: context.asked
      rounds: context.rounds

  - id: reground_lookup
    kind: check
    check: reground_context_lookup
    args:
      blockers: reground_context.fresh
    when: reground_context.passed == true

  - id: regrounding_loop
    kind: ai
    body: [plan, reground_context, reground_lookup]
    until: reground_context.passed == false
    max_iterations: 2
    depends_on: [context]

  - id: plan_ready
    kind: gate
    condition: plan.ready == true
    depends_on: [regrounding_loop]
    on_fail: blocked
    on_fail_reason: "Plan not ready"

  # B13's override (Blueprint 016 B1). The risk gate zeroes lookups at low
  # risk; if the plan then writes a criterion demanding a citable source, the
  # implementer would fabricate one rather than refuse — measured once, six
  # iterations of it. This node re-reads the criteria for free and, when they
  # demand verifiability, fires the one bundled lookup the risk gate declined,
  # at the medium-risk budget. $0 where no criterion demands citation.
  # Depends on plan_ready: the single chain through the loop and feasibility
  # always resolves there before build starts.
  - id: verify_grounding
    kind: check
    check: verify_grounding
    depends_on: [plan_ready]

  # ── build ───────────────────────────────────────────────────────────────
  # The lead implements alone; the others review without redesigning.
  - id: implement
    kind: ai
    tier: engineering
    specialist: lead
    prompt: implement
    schema: ImplementVerdict
    max_tokens: plan_max_tokens    # the deliverable is plan-sized; 16k truncated it twice (073, 075)

  # B13's honest-refusal gate (Blueprint 016 B2/B3). The implementer's ruled
  # channel for saying a criterion cannot be honestly satisfied is blocked_on;
  # this free check asks whether any blocked entry names a plan success
  # criterion, and if one does, the gate routes straight to escalation —
  # before a single paid judge sees the work. The measured failure this
  # prevents: six iterations of fabricating citations against an impossible
  # criterion, ended only by the cost ceiling.
  #
  # The check runs in all three loop bodies. What differs is the GATE behind
  # it: `blocked_gate` routes, and routes only from build_loop, because a
  # routing gate inside recovery_loop or review_rework_loop would re-enter the
  # escalation sub-graph with a fresh budget each time — an unbounded path.
  # Those two carry `blocked_terminal` instead, which ends the run rather than
  # routing it, and so has no re-entry to bound. Superseded 2026-09-20: this
  # comment read "it lives in build_loop's body ONLY" until the green-but-
  # blocked gap was closed, and that sentence outlived the wiring it described
  # by one commit.
  - id: blocked_check
    kind: check
    check: blocked_on_unmet
    args:
      blocked_on: implement.blocked_on
      criteria: plan.success_criteria
    depends_on: [implement]

  - id: blocked_gate
    kind: gate
    condition: blocked_check.passed == true
    depends_on: [blocked_check]
    on_fail: escalation
    on_fail_reason: "Implementation blocked on a criterion it cannot satisfy"

  # The same block, inside the two loops that sit in the escalation sub-graph,
  # ending the run instead of routing it. The routing gate above cannot go
  # there — it would re-enter the sub-graph with a fresh iteration budget each
  # time, which is unbounded. A TERMINAL gate has no such path: it ends.
  #
  # What it fixes, found by reading rather than by a trace: the block was
  # absent from those bodies entirely, and `blocked_check` is the only thing
  # that reads `blocked_on` independently of `green`. validate's failure-log
  # write is guarded on the iteration being red. So an implementation that came
  # back GREEN while naming a criterion it could not satisfy recorded nothing
  # and met no gate in rework or recovery — the fold saw four green judges, the
  # loop converged, and the work SHIPPED carrying the refusal. Ending `blocked`
  # is the honest terminal: the same one `plan_ready` and `recoverable` use
  # when the run cannot proceed truthfully.
  - id: blocked_terminal
    kind: gate
    condition: blocked_check.passed == true
    depends_on: [blocked_check]
    on_fail: blocked
    on_fail_reason: "Blocked on a criterion the implementation cannot satisfy"

  - id: domain_review
    kind: ai
    tier: judge                # Ruling D35: a different pretraining lineage judges
    specialist: peers          # the other builders, never the validator
    prompt: domain_review
    max_tokens: judge_max_tokens
    depends_on: [implement]
    when: implement.green == true

  # Free checks run before the paid validator. If the implementation does not
  # even mention a criterion, no model call is needed to know it is not done.
  - id: coverage
    kind: check
    check: criteria_addressed
    args:
      criteria: plan.success_criteria
      text: implement.summary
    depends_on: [implement]

  - id: consistency
    kind: check
    check: numbers_consistent
    args:
      plan: plan.plan
      implementation: implement.summary
    depends_on: [implement]

  - id: validate
    kind: ai
    tier: judge                # Ruling D35: a different pretraining lineage judges
    specialist: test_engineer
    prompt: validate
    schema: ValidateVerdict
    max_tokens: judge_max_tokens    # a verdict, not a second implementation
    depends_on: [coverage, consistency, domain_review]

  # Every judge this body produced, folded into one signal. The loop used to
  # exit on validate alone; measured once (n=1, and it only takes one), that let
  # it stop satisfied while the domain reviewer had already flagged a critical
  # concern and flipped implement red — and validate turned out to be the judge
  # that was wrong, having marked a criterion PASS while saying in the same
  # sentence that the test case had been changed away from what it demanded.
  - id: judges
    kind: check
    check: judges_agree
    args:
      implement: implement.green
      validate: validate.green
      # Ruling D46 (3): the whole check output, not just its passed — the fold
      # must see `checked` so a check that compared nothing is non-blocking
      # and listed rather than dissenting on a comparison that never happened.
      coverage: coverage
      consistency: consistency
    depends_on: [implement, coverage, consistency, validate]

  - id: build_loop
    kind: ai
    body: [implement, blocked_check, blocked_gate, domain_review, coverage, consistency, validate, judges]
    until: judges.passed == true
    max_iterations: max_iterations      # resolved from settings
    on_exhausted: escalation
    depends_on: [verify_grounding]

  # ── recover ─────────────────────────────────────────────────────────────
  - id: escalation
    kind: ai
    tier: escalation
    prompt: escalation
    schema: EscalationVerdict
    max_tokens: escalation_max_tokens

  - id: recoverable
    kind: gate
    condition: not escalation.requires_human
    depends_on: [escalation]
    on_fail: blocked
    on_fail_reason: "Escalation requires human intervention"

  - id: recovery_loop
    kind: ai
    body: [implement, blocked_check, blocked_terminal, domain_review, coverage, consistency, validate, judges, rework_review, review_fold]
    until: review_fold.passed == true
    max_iterations: escalation_recovery_attempts
    on_exhausted_status: escalated
    depends_on: [recoverable]

  # ── review ──────────────────────────────────────────────────────────────
  # Team size scales with risk; the verdict gates, and a block routes to rework.
  - id: review
    kind: ai
    tier: judge                # Ruling D35: a different pretraining lineage judges
    specialist: reviewers
    prompt: review
    schema: ReviewVerdict
    max_tokens: judge_max_tokens    # findings must fit beside the work they judge; a verdict, not an implementation
    depends_on: [build_loop]

  # ── review gate ─────────────────────────────────────────────────────────
  # A review that says do not ship used to reach exactly one place: the
  # `shipped` column of episodic memory. The run still reported `completed`,
  # which made the review decorative. Now it decides.
  # A blocked review used to end the run and its findings had nowhere to go:
  # three traces in four terminated here with the work unfixed and the diagnosis
  # unread (§15.1). It routes into a rework loop now instead of ending.
  - id: review_clean
    kind: gate
    condition: review.ship == true
    depends_on: [review]
    on_fail: review_rework_loop
    on_fail_reason: "Review found blocking issues"

  # The rework loop re-reviews its own work, and does so through a node of its
  # own rather than reusing `review`. A loop owns its body: any node listed
  # there is taken off the main schedule, so putting `review` in this body
  # deleted the first review from the pipeline entirely and took `review_clean`
  # and `independent_check` with it. Same phase, same prompt, same tier — a
  # second call site, because the scheduler distinguishes nodes and not phases.
  - id: rework_review
    kind: ai
    tier: judge                # Ruling D35: a different pretraining lineage judges
    specialist: reviewers
    prompt: review
    schema: ReviewVerdict
    max_tokens: judge_max_tokens    # same ceiling as review: same prompt, same tier, second call site
    depends_on: [validate]

  # Folds the build judges and the re-review together: work ships when everyone
  # who looked at it agrees, not when the last one to speak does.
  - id: review_fold
    kind: check
    check: judges_agree
    args:
      build: judges.passed
      review: rework_review.ship
    depends_on: [judges, rework_review]

  # Review and implement can disagree indefinitely; the graph cannot. Every
  # disagreement path is bounded and ends in escalation or a human.
  - id: review_rework_loop
    kind: ai
    body: [implement, blocked_check, blocked_terminal, domain_review, coverage, consistency, validate, judges, rework_review, review_fold]
    until: review_fold.passed == true
    max_iterations: review_rework_attempts
    on_exhausted: escalation

  # ── independent pass ────────────────────────────────────────────────────
  # Only for work that cannot be recalled once released: a signed rollout, a
  # mass migration, a public release. Risk asks whether a wrong answer harms
  # someone; this asks whether it can be taken back. Such work stays `high`
  # rather than inflating `critical`, and earns one more reviewer — on a model
  # that has seen none of the reviews above it. Skips when no premium tier is
  # configured.
  - id: independent_check
    kind: ai
    when: triage.unrecallable
    tier: independent
    prompt: doublecheck
    schema: DoubleCheckVerdict
    depends_on: [review_clean]

  # Ruling D46 (2): a verdict that can block has a consumer. This check's
  # do-not-ship was read by nothing — the run could complete after the one
  # reviewer that sees unrecallable work said not to ship. Its refusal now
  # ends the run blocked, and _gate_detail carries the verdict's findings
  # into the reason. A terminal, not a route: a do-not-ship is not an
  # iteration. Carries the node's own `when:` — a gate that reads a path the
  # skipped node never wrote raises (hard rule 3).
  - id: independent_verdict
    kind: gate
    when: triage.unrecallable
    # Ruling D48 (3): the gate reads a typed veto, true only when the check
    # ran and said do not ship — so a skip (which records no ship at all)
    # passes, and a real do-not-ship blocks. The same path on both branches.
    condition: not independent_check.vetoed
    depends_on: [independent_check]
    on_fail: blocked
    on_fail_reason: "Independent check: do not ship"
