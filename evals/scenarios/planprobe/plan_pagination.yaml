id: plan_pagination
workflow: plan-probe
description: Plan probe 3 of 3. Small, specified, feasible.
request: "Add cursor-based pagination to the existing list-workflows endpoint with a default page size of 50 and a maximum of 200"
tags: [planprobe]
expect:
  # The assertion vocabulary has no plan_ready, and inventing one is out of
  # scope here. Readiness, the success criteria and the token burn are read
  # from the retained verdicts in the results JSONL instead — which is what
  # that retention exists for. PlanVerdict's own validators already reject a
  # stub: a plan is required when ready, blockers when not, and "..." or "TBD"
  # criteria are refused, so a stub now fails inside the retry loop.
  status: completed
  path_includes: [plan]
  max_calls: 6
