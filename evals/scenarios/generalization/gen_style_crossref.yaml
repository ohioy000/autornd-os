id: gen_style_crossref
description: >
  Generalization trace 3 of 3: the cross-reference discipline in a
  non-engineering shape.

  `conv_crossref_integrity` found that the implementation agent writes each
  section as an independent narrative unit and never performs a global
  dependency-ordering pass (§18.1). That diagnosis was made on engineering work.
  This asks whether it is a property of the agent or of the subject.

  Risk, honestly: the risk guide names style guides twice, once as a standard
  that exists for consistency rather than harm, and once as paperwork whose
  worst case is rework or an unhappy audience. Both clauses put this at `low`
  or `medium`. It is the one trace here where the guide has already ruled on
  the subject, which makes it a check on the guide as much as on the dialect.
request: >
  Write the house style guide for a publication covering personal finance for a
  general audience. It must have separate sections on numbers and units, on
  naming financial products, on how to describe risk and uncertainty, and on
  citation format. Every rule that depends on another rule must cross-reference
  it explicitly by section, and the numbers section and the risk section must
  agree on how percentages and ranges are written, since both of them govern it.
  Include a worked example for each section that obeys every rule the guide
  states elsewhere.
tags: [generalization, studio, b14]
expect:
  risk_at_least: low
  max_calls: 40
  criteria_addressed: true
