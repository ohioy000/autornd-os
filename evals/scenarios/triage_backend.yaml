id: triage_backend
workflow: triage-only
description: >
  A routine, well-specified backend change — the shape that should be cheap.
request: "Add a database index on the sensor_readings timestamp column to speed up range queries"
tags: [triage, backend, routine]
expect:
  domains_include: [backend]
  risk: medium
  # Only the domain specialist is asserted. Measured over five runs, triage
  # assigns a test engineer to medium-risk work inconsistently — but the test
  # engineer runs the validate phase regardless of the roster, so its presence
  # here is a judgement call about who joins the review, not a rule. Expecting
  # it was my assumption, and the measurement did not support it.
  specialists_include: [backend_engineer]
  status: completed
  max_calls: 2
